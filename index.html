<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebreak</title>
<meta name="description" content="Firebreak — Scam Link Checker for Android. Legal and privacy documents.">
<link rel="icon" href="logo.png">
<style>
  :root { --bg:#080d14; --panel:#0e1624; --border:#1e2c40; --text:#eef3f8; --muted:#b9c6d4; --link:#7fc4ff; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font:16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
    -webkit-text-size-adjust:100%;
  }
  .wrap { max-width:560px; width:100%; }
  img.logo { width:260px; max-width:80%; height:auto; display:block; margin-bottom:26px; }
  p { color:var(--muted); margin:0 0 26px; }
  h1 { font-size:1.05rem; margin:0 0 12px; color:var(--muted); font-weight:600; letter-spacing:.02em; text-transform:uppercase; }
  ul { list-style:none; padding:0; margin:0; }
  li { margin:0 0 10px; }
  a.doc {
    display:block; background:var(--panel); border:1px solid var(--border);
    border-radius:12px; padding:16px 18px; color:var(--link); text-decoration:none;
  }
  a.doc:hover { border-color:#30455f; color:#a9d9ff; }
  footer { margin-top:30px; color:var(--muted); font-size:.88rem; }
  @media (max-width:560px) { img.logo { width:210px; } }
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.png" alt="Firebreak">
    <p>Firebreak checks a web link before it opens — fake addresses, unwanted app downloads and scam wording.</p>
    <h1>Documents</h1>
    <ul>
      <li><a class="doc" href="privacy-policy.html">Privacy Policy</a></li>
    </ul>
    <footer>Android package <code>com.firebreak.app</code></footer>
  </div>
</body>
</html>
